<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гексагональное Домино</title>
    <style>
        /* Стили остаются практически такими же, только обновляем .domino-piece */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 10px;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.6em;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .board-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            order: 1;
            overflow: hidden;
        }

        .board-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #FFD700;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 60vh;
            min-height: 400px;
            overflow: auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            background: rgba(0, 0, 0, 0.2);
        }

        .controls {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            order: 2;
        }

        .control-group {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .control-group h3 {
            margin-bottom: 8px;
            color: #FFD700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 4px;
            font-size: 1.1em;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .control-button {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .control-button:active {
            transform: scale(0.95);
            background: linear-gradient(45deg, #e55a5a, #e57e48);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .player {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            flex: 1;
            margin: 0 5px;
        }

        .player.active {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
        }

        .domino-pieces {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .domino-piece {
            width: 60px;
            height: 30px;
            background: linear-gradient(45deg, #8B4513, #A0522D);
            border: 2px solid #DEB887;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-size: 0.9em;
        }

        .domino-piece::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: #DEB887;
            transform: translateX(-50%);
        }

        .domino-piece:active {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .domino-piece.selected {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            transform: scale(1.15);
        }

        .domino-piece.used {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .domino-value {
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .game-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }

        .coordinates-info {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 0.8em;
        }

        .score-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #FFD700;
            margin: 8px 0;
        }

        .swipe-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8em;
            margin-top: 5px;
        }

        .zoom-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .zoom-button {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            cursor: pointer;
        }

        .orientation-preview {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9em;
            z-index: 10;
        }

        /* Адаптивные стили остаются без изменений */
        @media (max-width: 768px) and (orientation: portrait) {
            .board-container {
                order: 2;
            }
            
            .controls {
                order: 1;
            }
            
            .canvas-container {
                height: 50vh;
                min-height: 350px;
            }
            
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            
            .domino-pieces {
                max-height: 80px;
            }
            
            .domino-piece {
                width: 50px;
                height: 25px;
                font-size: 0.8em;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            .game-area {
                flex-direction: row;
            }
            
            .board-container {
                flex: 2;
                order: 1;
            }
            
            .controls {
                flex: 1;
                order: 2;
                max-width: 40%;
            }
            
            .domino-pieces {
                max-height: 80px;
            }
            
            .canvas-container {
                height: 70vh;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.4em;
            }
            
            .control-button {
                padding: 12px 8px;
                font-size: 0.8em;
                min-height: 45px;
            }
            
            .domino-piece {
                width: 45px;
                height: 22px;
                font-size: 0.8em;
            }
            
            .player {
                padding: 6px;
                font-size: 0.9em;
            }
            
            .canvas-container {
                height: 45vh;
                min-height: 300px;
            }
        }

        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="no-select">
    <div class="container">
        <header>
            <h1>🎲 Гексагональное Домино</h1>
            <p>Размещайте костяшки, совмещая числа</p>
        </header>

        <div class="game-area">
            <div class="board-container">
                <div class="board-title">Игровое поле</div>
                <div class="canvas-container">
                    <canvas id="gameBoard"></canvas>
                    <div class="zoom-controls">
                        <button class="zoom-button" id="zoomIn">+</button>
                        <button class="zoom-button" id="zoomOut">-</button>
                        <button class="zoom-button" id="resetView">⟳</button>
                    </div>
                    <div class="orientation-preview" id="orientationPreview">
                        Ориентация: 0°
                    </div>
                </div>
                
                <div class="game-info">
                    <div id="gamePhase">Фаза расстановки</div>
                    <div class="score-display" id="scoreDisplay">Счёт: 0 | Осталось: 28</div>
                    <div class="coordinates-info">
                        <div>Координаты: <span id="coordsInfo">Нажмите на поле</span></div>
                    </div>
                    <div class="swipe-hint">💡 Свайп для поворота, два пальца для масштаба</div>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <h3>🎮 Управление</h3>
                    <div class="buttons-grid">
                        <button class="control-button" id="newGameBtn">Новая игра</button>
                        <button class="control-button" id="shufflePieces">🔀 Перемешать</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>👥 Игроки</h3>
                    <div class="player-info">
                        <div class="player active" id="player1">
                            <div>Игрок 1</div>
                            <div>Костяшек: <span id="player1Count">7</span></div>
                        </div>
                        <div class="player" id="player2">
                            <div>Игрок 2</div>
                            <div>Костяшек: <span id="player2Count">7</span></div>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🎲 Ваши костяшки</h3>
                    <div class="domino-pieces" id="dominoPieces">
                        <!-- Костяшки будут добавлены здесь -->
                    </div>
                </div>

                <div class="control-group">
                    <h3>⚙️ Настройки</h3>
                    <div class="buttons-grid">
                        <button class="control-button" id="toggleNumbers">🔢 Числа</button>
                        <button class="control-button" id="toggleLines">📐 Линии</button>
                        <button class="control-button" id="toggleGrid">🔷 Сетка</button>
                        <button class="control-button" id="toggleHighlights">✨ Подсветка</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class HexagonalDomino {
            constructor() {
                this.canvas = document.getElementById('gameBoard');
                this.ctx = this.canvas.getContext('2d');
                
                // Размеры поля и шестиугольников
                this.boardSize = 15; // Увеличиваем поле
                this.baseHexSize = 20;
                
                // Настройки камеры
                this.camera = {
                    x: 0,
                    y: 0,
                    scale: 1,
                    minScale: 0.5,
                    maxScale: 3
                };
                
                // Игровое состояние
                this.currentPlayer = 0;
                this.gamePhase = 'placement';
                this.selectedPiece = null;
                this.pieceOrientation = 0; // 0-5: направления для половинок
                
                // Игровые данные
                this.board = []; // Теперь хранит объекты {value1, value2, orientation, player} или null
                this.dominoPieces = [];
                this.usedPieces = [];
                this.players = [
                    { pieces: [], score: 0 },
                    { pieces: [], score: 0 }
                ];
                
                // Настройки отображения
                this.showNumbers = true;
                this.showLines = true;
                this.showGrid = true;
                this.showHighlights = true;

                // Для управления
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.isDragging = false;
                this.lastTouchDistance = 0;
                
                // Для превью
                this.mousePos = { x: 0, y: 0 };
                this.hoveredHex = null;
                this.validMoves = [];
                
                this.initializeGame();
                this.setupEventListeners();
                this.createDominoPieces();
                this.dealPieces();
                
                // Устанавливаем размеры canvas и центрируем камеру
                // Используем requestAnimationFrame чтобы убедиться, что DOM готов
                requestAnimationFrame(() => {
                    this.setCanvasSize();
                    this.drawBoard();
                });
            }
            
            setCanvasSize() {
                const container = this.canvas.parentElement;
                const width = container.clientWidth;
                const height = container.clientHeight;
                
                if (width === 0 || height === 0) {
                    // Контейнер еще не имеет размеров, попробуем позже
                    setTimeout(() => this.setCanvasSize(), 100);
                    return;
                }
                
                const dpr = window.devicePixelRatio || 1;
                
                // Устанавливаем размеры canvas
                this.canvas.width = width * dpr;
                this.canvas.height = height * dpr;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
                
                // Сбрасываем контекст и применяем DPR масштаб
                this.ctx.setTransform(1, 0, 0, 1, 0, 0); // Сброс трансформаций
                this.ctx.scale(dpr, dpr);
                
                // Центрируем камеру после установки размеров
                this.centerCamera();
            }
            
            centerCamera() {
                // Вычисляем центр игрового поля в мировых координатах
                const totalWidth = this.boardSize * this.baseHexSize * 1.5;
                const totalHeight = this.boardSize * this.baseHexSize * Math.sqrt(3);
                const worldCenterX = totalWidth / 2;
                const worldCenterY = totalHeight / 2;
                
                const container = this.canvas.parentElement;
                const canvasWidth = container.clientWidth;
                const canvasHeight = container.clientHeight;
                
                // Вычисляем масштаб так, чтобы поле помещалось на экран
                const scaleX = canvasWidth / totalWidth;
                const scaleY = canvasHeight / totalHeight;
                this.camera.scale = Math.min(scaleX, scaleY) * 0.8;
                
                // Центрируем камеру: центр поля должен быть в центре экрана
                this.camera.x = canvasWidth / 2 - worldCenterX * this.camera.scale;
                this.camera.y = canvasHeight / 2 - worldCenterY * this.camera.scale;
            }
            
            initializeGame() {
                // Инициализируем пустое поле
                this.board = Array(this.boardSize).fill().map(() => 
                    Array(this.boardSize).fill(null)
                );
                
                this.currentPlayer = 0;
                this.gamePhase = 'placement';
                this.selectedPiece = null;
                this.pieceOrientation = 0;
                this.usedPieces = [];
                this.players[0].pieces = [];
                this.players[1].pieces = [];
                this.players[0].score = 0;
                this.players[1].score = 0;
                this.validMoves = [];
                this.hoveredHex = null;
                
                this.createDominoPieces();
                this.dealPieces();
                this.centerCamera();
                this.updateGamePhase();
                this.updateScores();
                this.drawBoard();
            }
            
            setupEventListeners() {
                // Обработчики касаний для canvas
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        this.touchStartX = touch.clientX - rect.left;
                        this.touchStartY = touch.clientY - rect.top;
                        this.isDragging = true;
                        
                        this.mousePos.x = this.touchStartX;
                        this.mousePos.y = this.touchStartY;
                        this.updateHoveredHex();
                    } else if (e.touches.length === 2) {
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        const rect = this.canvas.getBoundingClientRect();
                        
                        const x1 = touch1.clientX - rect.left;
                        const y1 = touch1.clientY - rect.top;
                        const x2 = touch2.clientX - rect.left;
                        const y2 = touch2.clientY - rect.top;
                        
                        this.lastTouchDistance = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                    }
                }, { passive: false });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    
                    if (e.touches.length === 1 && this.isDragging) {
                        const touch = e.touches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;
                        
                        this.mousePos.x = x;
                        this.mousePos.y = y;
                        this.updateHoveredHex();
                        
                        // Перемещение камеры: движение в пикселях экрана напрямую
                        const deltaX = x - this.touchStartX;
                        const deltaY = y - this.touchStartY;
                        
                        this.camera.x += deltaX;
                        this.camera.y += deltaY;
                        
                        this.touchStartX = x;
                        this.touchStartY = y;
                        
                        this.drawBoard();
                    } else if (e.touches.length === 2) {
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        const rect = this.canvas.getBoundingClientRect();
                        
                        const x1 = touch1.clientX - rect.left;
                        const y1 = touch1.clientY - rect.top;
                        const x2 = touch2.clientX - rect.left;
                        const y2 = touch2.clientY - rect.top;
                        
                        const distance = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                        const scaleChange = distance / this.lastTouchDistance;
                        
                        // Центр между двумя точками на экране (в пикселях экрана)
                        const screenCenterX = (x1 + x2) / 2;
                        const screenCenterY = (y1 + y2) / 2;
                        
                        this.zoom(scaleChange, screenCenterX, screenCenterY);
                        
                        this.lastTouchDistance = distance;
                    }
                }, { passive: false });
                
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    
                    if (e.changedTouches.length === 1 && !e.touches.length) {
                        const touch = e.changedTouches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;
                        
                        const deltaX = x - this.touchStartX;
                        const deltaY = y - this.touchStartY;
                        
                        // Если был клик (маленькое перемещение)
                        if (Math.sqrt(deltaX ** 2 + deltaY ** 2) < 10) {
                            const worldPos = this.screenToWorld(x, y);
                            this.handleBoardClick(worldPos.x, worldPos.y);
                        }
                        // Свайп больше не используется для поворота (ориентация определяется автоматически)
                    }
                    
                    this.isDragging = false;
                }, { passive: false });
                
                // Обработчики мыши
                let isMouseDragging = false;
                let mouseStartX = 0;
                let mouseStartY = 0;
                
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    this.mousePos.x = x;
                    this.mousePos.y = y;
                    this.updateHoveredHex();
                    
                    // Перетаскивание камеры мышью
                    if (isMouseDragging) {
                        const deltaX = x - mouseStartX;
                        const deltaY = y - mouseStartY;
                        
                        this.camera.x += deltaX;
                        this.camera.y += deltaY;
                        
                        mouseStartX = x;
                        mouseStartY = y;
                    }
                    
                    this.drawBoard();
                });
                
                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    mouseStartX = x;
                    mouseStartY = y;
                    isMouseDragging = true;
                });
                
                this.canvas.addEventListener('mouseup', (e) => {
                    if (!isMouseDragging) return;
                    
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const deltaX = x - mouseStartX;
                    const deltaY = y - mouseStartY;
                    
                    // Если был клик
                    if (Math.sqrt(deltaX ** 2 + deltaY ** 2) < 5) {
                        const worldPos = this.screenToWorld(x, y);
                        this.handleBoardClick(worldPos.x, worldPos.y);
                    }
                    
                    isMouseDragging = false;
                });
                
                this.canvas.addEventListener('mouseleave', () => {
                    isMouseDragging = false;
                });
                
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const worldPos = this.screenToWorld(x, y);
                    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                    
                    this.zoom(zoomFactor, worldPos.x, worldPos.y);
                }, { passive: false });
                
                // Кнопки управления
                document.getElementById('newGameBtn').addEventListener('click', () => this.initializeGame());
                document.getElementById('shufflePieces').addEventListener('click', () => this.shufflePlayerPieces());
                document.getElementById('toggleNumbers').addEventListener('click', () => this.toggleNumbers());
                document.getElementById('toggleLines').addEventListener('click', () => this.toggleLines());
                document.getElementById('toggleGrid').addEventListener('click', () => this.toggleGrid());
                document.getElementById('toggleHighlights').addEventListener('click', () => this.toggleHighlights());
                
                // Кнопки масштабирования
                document.getElementById('zoomIn').addEventListener('click', () => {
                    const canvasWidth = this.canvas.width / (window.devicePixelRatio || 1);
                    const canvasHeight = this.canvas.height / (window.devicePixelRatio || 1);
                    this.zoom(1.2, canvasWidth / 2, canvasHeight / 2);
                });
                
                document.getElementById('zoomOut').addEventListener('click', () => {
                    const canvasWidth = this.canvas.width / (window.devicePixelRatio || 1);
                    const canvasHeight = this.canvas.height / (window.devicePixelRatio || 1);
                    this.zoom(0.8, canvasWidth / 2, canvasHeight / 2);
                });
                
                document.getElementById('resetView').addEventListener('click', () => this.centerCamera());
                
                // Горячие клавиши (поворот больше не используется)

                window.addEventListener('resize', () => {
                    setTimeout(() => {
                        this.setCanvasSize();
                        this.drawBoard();
                    }, 100);
                });

                this.canvas.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });
            }
            
            updateHoveredHex() {
                const worldPos = this.screenToWorld(this.mousePos.x, this.mousePos.y);
                this.hoveredHex = this.getHexAtPosition(worldPos.x, worldPos.y);
            }
            
            screenToWorld(screenX, screenY) {
                // Преобразуем координаты экрана в мировые координаты
                // Сначала вычитаем смещение камеры, затем делим на масштаб
                return {
                    x: (screenX - this.camera.x) / this.camera.scale,
                    y: (screenY - this.camera.y) / this.camera.scale
                };
            }
            
            worldToScreen(worldX, worldY) {
                // Преобразуем мировые координаты в координаты экрана
                // Сначала умножаем на масштаб, затем добавляем смещение камеры
                return {
                    x: worldX * this.camera.scale + this.camera.x,
                    y: worldY * this.camera.scale + this.camera.y
                };
            }
            
            zoom(factor, centerX, centerY) {
                // centerX, centerY - координаты точки на экране, относительно которой масштабируем
                const newScale = this.camera.scale * factor;
                
                if (newScale >= this.camera.minScale && newScale <= this.camera.maxScale) {
                    // Преобразуем точку на экране в мировые координаты ДО изменения масштаба
                    const worldPoint = this.screenToWorld(centerX, centerY);
                    
                    // Изменяем масштаб
                    this.camera.scale = newScale;
                    
                    // Вычисляем, где теперь находится эта точка после масштабирования
                    const screenPointAfter = this.worldToScreen(worldPoint.x, worldPoint.y);
                    
                    // Сдвигаем камеру так, чтобы точка осталась на месте
                    this.camera.x += centerX - screenPointAfter.x;
                    this.camera.y += centerY - screenPointAfter.y;
                    
                    this.drawBoard();
                }
            }
            
            createDominoPieces() {
                this.dominoPieces = [];
                for (let i = 0; i <= 5; i++) {
                    for (let j = i; j <= 5; j++) {
                        this.dominoPieces.push({
                            id: `${i}-${j}`,
                            values: [i, j],
                            used: false
                        });
                    }
                }
            }
            
            dealPieces() {
                const shuffled = [...this.dominoPieces].sort(() => Math.random() - 0.5);
                this.players[0].pieces = shuffled.slice(0, 7);
                this.players[1].pieces = shuffled.slice(7, 14);
                this.remainingPieces = shuffled.slice(14);
                
                this.updateDominoPalette();
            }
            
            updateDominoPalette() {
                const palette = document.getElementById('dominoPieces');
                palette.innerHTML = '';
                
                const currentPlayerPieces = this.players[this.currentPlayer].pieces;
                
                if (currentPlayerPieces.length === 0) {
                    palette.innerHTML = '<div style="color: white; text-align: center;">Нет костяшек</div>';
                } else {
                    currentPlayerPieces.forEach((piece, index) => {
                        const pieceElement = document.createElement('div');
                        pieceElement.className = 'domino-piece';
                        if (this.selectedPiece === piece) pieceElement.classList.add('selected');
                        
                        pieceElement.innerHTML = `
                            <div class="domino-value">${piece.values[0]}</div>
                            <div class="domino-value">${piece.values[1]}</div>
                        `;
                        
                        pieceElement.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.selectedPiece = piece;
                            this.calculateValidMoves();
                            this.updateDominoPalette();
                            this.drawBoard();
                        });
                        
                        palette.appendChild(pieceElement);
                    });
                    
                    // Автоматически выбираем первую костяшку
                    if (!this.selectedPiece && currentPlayerPieces.length > 0) {
                        this.selectedPiece = currentPlayerPieces[0];
                        this.calculateValidMoves();
                    }
                }
                
                document.getElementById('player1Count').textContent = 
                    this.players[0].pieces.length;
                document.getElementById('player2Count').textContent = 
                    this.players[1].pieces.length;
            }
            
            // Функции поворота больше не используются - ориентация определяется автоматически
            
            toggleNumbers() {
                this.showNumbers = !this.showNumbers;
                this.drawBoard();
            }
            
            toggleLines() {
                this.showLines = !this.showLines;
                this.drawBoard();
            }
            
            toggleGrid() {
                this.showGrid = !this.showGrid;
                this.drawBoard();
            }
            
            toggleHighlights() {
                this.showHighlights = !this.showHighlights;
                this.drawBoard();
            }
            
            shufflePlayerPieces() {
                const currentPieces = this.players[this.currentPlayer].pieces.filter(p => !p.used);
                const shuffled = [...currentPieces].sort(() => Math.random() - 0.5);
                this.players[this.currentPlayer].pieces = [
                    ...shuffled,
                    ...this.players[this.currentPlayer].pieces.filter(p => p.used)
                ];
                this.updateDominoPalette();
            }
            
            getHexCenter(row, col) {
                const hexSize = this.baseHexSize;
                const hexHeight = hexSize * Math.sqrt(3);
                const hexWidth = hexSize * 2;
                
                const x = col * hexWidth * 0.75 + hexWidth / 2;
                const y = row * hexHeight + (col % 2) * hexHeight / 2 + hexHeight / 2;
                
                return { x, y, hexSize };
            }
            
            getHexAtPosition(worldX, worldY) {
                const hexSize = this.baseHexSize;
                const hexHeight = hexSize * Math.sqrt(3);
                const hexWidth = hexSize * 2;
                
                const col = Math.floor(worldX / (hexWidth * 0.75));
                const row = Math.floor((worldY - (col % 2) * hexHeight / 2) / hexHeight);
                
                for (let r = Math.max(0, row - 1); r <= Math.min(this.boardSize - 1, row + 1); r++) {
                    for (let c = Math.max(0, col - 1); c <= Math.min(this.boardSize - 1, col + 1); c++) {
                        const center = this.getHexCenter(r, c);
                        const distance = Math.sqrt((worldX - center.x) ** 2 + (worldY - center.y) ** 2);
                        
                        if (distance < center.hexSize * 0.9) {
                            return { row: r, col: c, hexX: center.x, hexY: center.y, distance };
                        }
                    }
                }
                
                return null;
            }
            
            getNeighborInDirection(row, col, direction) {
                const directions = [
                    () => ({ row: row + 1, col: col }), // вниз
                    () => { // вниз-вправо
                        if (col % 2 === 0) {
                            return { row: row, col: col + 1 };
                        } else {
                            return { row: row + 1, col: col + 1 };
                        }
                    },
                    () => { // вверх-вправо
                        if (col % 2 === 0) {
                            return { row: row - 1, col: col + 1 };
                        } else {
                            return { row: row, col: col + 1 };
                        }
                    },
                    () => ({ row: row - 1, col: col }), // вверх
                    () => { // вверх-влево
                        if (col % 2 === 0) {
                            return { row: row - 1, col: col - 1 };
                        } else {
                            return { row: row, col: col - 1 };
                        }
                    },
                    () => { // вниз-влево
                        if (col % 2 === 0) {
                            return { row: row, col: col - 1 };
                        } else {
                            return { row: row + 1, col: col - 1 };
                        }
                    }
                ];
                
                if (direction < directions.length) {
                    return directions[direction]();
                }
                return null;
            }
            
            isValidPosition(row, col) {
                return row >= 0 && row < this.boardSize && col >= 0 && col < this.boardSize;
            }
            
            calculateValidMoves() {
                this.validMoves = [];
                
                if (!this.selectedPiece) return;
                
                for (let row = 0; row < this.boardSize; row++) {
                    for (let col = 0; col < this.boardSize; col++) {
                        // Проверяем все возможные ориентации, чтобы найти правильную
                        let validOrientation = null;
                        
                        // Проверяем все ориентации и находим правильную
                        // Для первого хода берем ориентацию 0
                        if (this.usedPieces.length === 0) {
                            validOrientation = 0;
                        } else {
                            // Для последующих ходов проверяем все ориентации и находим правильную
                            let bestOrientation = null;
                            
                            // Сначала проверяем, что клетка свободна
                            if (this.board[row][col] !== null) {
                                continue; // Клетка занята, пропускаем
                            }
                            
                            // Проверяем, есть ли соседи
                            let hasNeighbors = false;
                            for (let dir = 0; dir < 6; dir++) {
                                const neighbor = this.getNeighborInDirection(row, col, dir);
                                if (neighbor && this.isValidPosition(neighbor.row, neighbor.col)) {
                                    const neighborCell = this.board[neighbor.row][neighbor.col];
                                    if (neighborCell !== null) {
                                        hasNeighbors = true;
                                        break;
                                    }
                                }
                            }
                            
                            // Если нет соседей, это невалидный ход (кроме первого хода)
                            if (!hasNeighbors) {
                                continue;
                            }
                            
                            // Проверяем все ориентации и находим правильную
                            for (let orientation = 0; orientation < 6; orientation++) {
                                let allConnectionsCorrect = true;
                                
                                // Проверяем всех соседей
                                for (let dir = 0; dir < 6; dir++) {
                                    const neighbor = this.getNeighborInDirection(row, col, dir);
                                    if (!neighbor || !this.isValidPosition(neighbor.row, neighbor.col)) {
                                        continue;
                                    }
                                    
                                    const neighborCell = this.board[neighbor.row][neighbor.col];
                                    if (neighborCell === null) {
                                        continue;
                                    }
                                    
                                    // Определяем индексы вершин, в направлении которых смотрят половинки размещаемой костяшки
                                    // Ориентация 0: половина 0 смотрит на вершину 0, половина 1 - на вершину 3
                                    const half0Vertex = orientation; // вершина, в направлении которой смотрит половина 0
                                    const half1Vertex = (orientation + 3) % 6; // вершина, в направлении которой смотрит половина 1
                                    
                                    // Точный индекс вершины по направлению к соседу
                                    const neighborVertexIndex = this.vertexIndexTowardNeighbor(row, col, dir);
                                    if (neighborVertexIndex === null) {
                                        allConnectionsCorrect = false;
                                        break;
                                    }
                                    
                                    // Проверяем, правильно ли повернута костяшка для соединения
                                    if (neighborCell.values[0] === neighborCell.values[1]) {
                                        // Сосед - дубль (например, 0:0)
                                        const neighborValue = neighborCell.values[0];
                                        
                                        // Для дубля сторона с нужным значением должна быть обращена точно к нему
                                        let currentValue = null;
                                        if (neighborVertexIndex === half0Vertex) {
                                            // Вершина половины 0 точно обращена к дублю
                                            currentValue = this.selectedPiece.values[0];
                                        } else if (neighborVertexIndex === half1Vertex) {
                                            // Вершина половины 1 точно обращена к дублю
                                            currentValue = this.selectedPiece.values[1];
                                        } else {
                                            // Ни одна сторона не обращена точно — ориентация не подходит
                                            allConnectionsCorrect = false;
                                            break;
                                        }
                                        
                                        if (currentValue !== neighborValue) {
                                            allConnectionsCorrect = false;
                                            break;
                                        }
                                    } else {
                                        // Сосед - обычная костяшка
                                        // Противоположное направление (от соседа к размещаемой костяшке)
                                        const neighborFacingDir = (dir + 3) % 6;
                                        const neighborFacingVertex = this.vertexIndexTowardNeighbor(neighbor.row, neighbor.col, neighborFacingDir);
                                        if (neighborFacingVertex === null) {
                                            allConnectionsCorrect = false;
                                            break;
                                        }
                                        
                                        // Определяем, какая половина соседа обращена к размещаемой костяшке
                                        const neighborHalf0Vertex = neighborCell.orientation;
                                        const neighborHalf1Vertex = (neighborCell.orientation + 3) % 6;
                                        
                                        let neighborValue = null;
                                        if (neighborFacingVertex === neighborHalf0Vertex) {
                                            neighborValue = neighborCell.values[0];
                                        } else if (neighborFacingVertex === neighborHalf1Vertex) {
                                            neighborValue = neighborCell.values[1];
                                        } else {
                                            // Используем fallback
                                            const neighborHalf = this.getHalfFacingDirection(neighborCell.orientation, neighborFacingDir);
                                            neighborValue = neighborCell.values[neighborHalf];
                                        }
                                        
                                        // Определяем, какая половина размещаемой костяшки обращена к соседу
                                        let currentValue = null;
                                        if (neighborVertexIndex === half0Vertex) {
                                            currentValue = this.selectedPiece.values[0];
                                        } else if (neighborVertexIndex === half1Vertex) {
                                            currentValue = this.selectedPiece.values[1];
                                        } else {
                                            // Ни одна сторона не обращена точно — ориентация не подходит
                                            allConnectionsCorrect = false;
                                            break;
                                        }
                                        
                                        if (currentValue !== neighborValue) {
                                            allConnectionsCorrect = false;
                                            break;
                                        }
                                    }
                                }
                                
                                // Если все соединения правильные - это правильная ориентация
                                if (allConnectionsCorrect) {
                                    bestOrientation = orientation;
                                    break; // Нашли правильную ориентацию
                                }
                            }
                            
                            validOrientation = bestOrientation;
                        }
                        
                        // Если нашли валидный ход с правильной ориентацией, сохраняем его
                        if (validOrientation !== null) {
                            this.validMoves.push({ row, col, orientation: validOrientation });
                        }
                    }
                }
            }
            
            canPlaceDomino(row, col, piece, orientation) {
                // Проверяем, что клетка свободна
                if (this.board[row][col] !== null) {
                    return false;
                }
                
                // Для первого хода разрешаем размещение без соседей
                if (this.usedPieces.length === 0) {
                    return true;
                }
                
                // Проверяем соседей
                const hasValidConnection = this.checkNeighborConnections(row, col, piece, orientation);
                
                return hasValidConnection;
            }
            
            checkNeighborConnections(row, col, piece, orientation) {
                // Проверяем, является ли размещаемая костяшка дублем (обе половинки одинаковые)
                const isPieceDouble = piece.values[0] === piece.values[1];
                const pieceValue = piece.values[0]; // Для дубля обе половинки одинаковые
                
                // Проверяем все 6 направлений
                for (let dir = 0; dir < 6; dir++) {
                    const neighbor = this.getNeighborInDirection(row, col, dir);
                    if (!neighbor || !this.isValidPosition(neighbor.row, neighbor.col)) {
                        continue;
                    }
                    
                    const neighborCell = this.board[neighbor.row][neighbor.col];
                    if (neighborCell === null) {
                        continue;
                    }
                    
                    // Проверяем, является ли сосед дублем
                    const isNeighborDouble = neighborCell.values[0] === neighborCell.values[1];
                    
                    if (isPieceDouble && isNeighborDouble) {
                        // Обе костяшки - дубли: соединение возможно, если значения совпадают
                        // Дубль может соединиться с дублем в любом направлении
                        if (pieceValue === neighborCell.values[0]) {
                            return true;
                        }
                    } else if (isPieceDouble) {
                        // Размещаемая костяшка - дубль, сосед - обычная
                        // Дубль может соединиться с любой половиной соседа в любом направлении, если значения совпадают
                        const neighborFacingDir = (dir + 3) % 6; // противоположное направление
                        const neighborHalf = this.getHalfFacingDirection(neighborCell.orientation, neighborFacingDir);
                        const neighborValue = neighborCell.values[neighborHalf];
                        
                        if (pieceValue === neighborValue) {
                            return true;
                        }
                    } else if (isNeighborDouble) {
                        // Сосед - дубль, размещаемая костяшка - обычная
                        // Проверяем, что в данной ориентации сторона с нужным значением обращена к дублю
                        const neighborValue = neighborCell.values[0]; // Для дубля обе половинки одинаковые
                        
                        // Определяем, какая половина размещаемой костяшки обращена к дублю
                        const currentHalf = this.getHalfFacingDirection(orientation, dir);
                        const currentValue = piece.values[currentHalf];
                        
                        // Сторона с нужным значением должна быть обращена к дублю
                        if (currentValue === neighborValue) {
                            return true;
                        }
                    } else {
                        // Обе костяшки - обычные
                        // Определяем, какая половина текущей костяшки обращена к соседу
                        const currentHalf = this.getHalfFacingDirection(orientation, dir);
                        const currentValue = piece.values[currentHalf];
                        
                        // Определяем, какая половина соседа обращена к текущей клетке
                        const neighborFacingDir = (dir + 3) % 6; // противоположное направление
                        const neighborHalf = this.getHalfFacingDirection(neighborCell.orientation, neighborFacingDir);
                        const neighborValue = neighborCell.values[neighborHalf];
                        
                        // Если значения совпадают - это валидное соединение
                        if (currentValue === neighborValue) {
                            return true;
                        }
                    }
                }
                
                return false;
            }
            
            // Преобразует направление соседа в индекс вершины шестиугольника
            // Направления: 0=вниз, 1=вниз-вправо, 2=вверх-вправо, 3=вверх, 4=вверх-влево, 5=вниз-влево
            // Вершины: 0=вправо(0°), 1=вверх-вправо(60°), 2=вверх-влево(120°), 3=влево(180°), 4=вниз-влево(240°), 5=вниз-вправо(300°)
            directionToVertexIndex(direction) {
                // Маппинг направлений на индексы вершин
                // Используем согласованное правило округления к ближайшей вершине по часовой стрелке
                // Углы рёбер: [270°, 330°, 30°, 90°, 150°, 210°]
                // Ближайшие вершины (с округлением вверх по часовой): [300°, 0°, 60°, 120°, 180°, 240°]
                // Что соответствует индексам вершин: [5, 0, 1, 2, 3, 4]
                const mapping = [5, 0, 1, 2, 3, 4]; // направление -> индекс вершины
                return mapping[direction];
            }
            
            getHalfFacingDirection(pieceOrientation, direction) {
                // Определяем, какая половина костяшки (0 или 1) обращена в заданном направлении
                // Ориентация 0: половина 0 смотрит в направлении вершины 0 (0°), половина 1 - в направлении вершины 3 (180°)
                
                // Преобразуем направление соседа в индекс вершины
                const vertexIndex = this.directionToVertexIndex(direction);
                
                // Преобразуем ориентацию половинок в индексы вершин
                const half0Vertex = pieceOrientation; // половина 0 смотрит на вершину orientation
                const half1Vertex = (pieceOrientation + 3) % 6; // половина 1 смотрит на вершину orientation+3
                
                // Проверяем точное совпадение
                if (vertexIndex === half0Vertex) return 0;
                if (vertexIndex === half1Vertex) return 1;
                
                // Если нет точного совпадения, выбираем ближайшую половину
                const diff0 = Math.min(
                    Math.abs(vertexIndex - half0Vertex),
                    6 - Math.abs(vertexIndex - half0Vertex)
                );
                const diff1 = Math.min(
                    Math.abs(vertexIndex - half1Vertex),
                    6 - Math.abs(vertexIndex - half1Vertex)
                );
                
                return diff0 < diff1 ? 0 : 1;
            }
            
            // Точный расчет: возвращает индекс вершины (0..5), в направлении которой расположен сосед dir
            // Вычисляется по вектору из центра текущей клетки к центру соседней
            vertexIndexTowardNeighbor(row, col, dir) {
                const neighbor = this.getNeighborInDirection(row, col, dir);
                if (!neighbor || !this.isValidPosition(neighbor.row, neighbor.col)) {
                    return null;
                }
                const c0 = this.getHexCenter(row, col);
                const c1 = this.getHexCenter(neighbor.row, neighbor.col);
                const angle = Math.atan2(c1.y - c0.y, c1.x - c0.x); // -PI..PI
                let a = angle;
                if (a < 0) a += Math.PI * 2; // 0..2PI
                // Ближайшая вершина с шагом 60°
                const idx = Math.round(a / (Math.PI / 3)) % 6;
                return idx;
            }
            
            handleBoardClick(worldX, worldY) {
                if (this.gamePhase !== 'placement' || !this.selectedPiece) return;
                
                const hex = this.getHexAtPosition(worldX, worldY);
                if (hex) {
                    // Находим валидный ход для этой позиции с правильной ориентацией
                    const validMove = this.validMoves.find(move => 
                        move.row === hex.row && move.col === hex.col
                    );
                    
                    if (validMove) {
                        // Используем ориентацию из валидного хода
                        this.placeDomino(hex.row, hex.col, this.selectedPiece, validMove.orientation);
                    }
                }
            }
            
            placeDomino(row, col, piece, orientation) {
                // Размещаем костяшку в одной клетке
                this.board[row][col] = {
                    values: [...piece.values],
                    orientation: orientation,
                    player: this.currentPlayer
                };
                
                piece.used = true;
                this.usedPieces.push({
                    piece: piece,
                    position: { row, col },
                    orientation: orientation,
                    player: this.currentPlayer
                });
                
                const points = piece.values[0] + piece.values[1];
                this.players[this.currentPlayer].score += points;
                
                // Удаляем использованную костяшку из руки игрока
                const pieceIndex = this.players[this.currentPlayer].pieces.findIndex(p => p === piece);
                if (pieceIndex !== -1) {
                    this.players[this.currentPlayer].pieces.splice(pieceIndex, 1);
                }
                
                this.selectedPiece = null;
                this.validMoves = [];
                
                // Проверяем окончание игры
                this.checkGameEnd();
                
                if (this.gamePhase !== 'gameover') {
                    // Передаем ход следующему игроку
                    this.currentPlayer = (this.currentPlayer + 1) % 2;
                    
                    // Проверяем, может ли текущий игрок сделать ход
                    const currentPlayerCanMove = this.players[this.currentPlayer].pieces.some(p => 
                        this.hasValidMove(p)
                    );
                    
                    if (!currentPlayerCanMove) {
                        // Если не может, проверяем другого игрока
                        const otherPlayer = (this.currentPlayer + 1) % 2;
                        const otherPlayerCanMove = this.players[otherPlayer].pieces.some(p => 
                            this.hasValidMove(p)
                        );
                        
                        if (!otherPlayerCanMove) {
                            // Если оба не могут - игра завершается
                            this.gamePhase = 'gameover';
                        } else {
                            // Если другой может - передаем ход ему
                            this.currentPlayer = otherPlayer;
                        }
                    }
                }
                
                this.updateGamePhase();
                this.updateScores();
                this.updateDominoPalette();
                this.drawBoard();
            }
            
            hasValidMove(piece) {
                // Проверяем все возможные позиции и ориентации для костяшки
                for (let row = 0; row < this.boardSize; row++) {
                    for (let col = 0; col < this.boardSize; col++) {
                        for (let orientation = 0; orientation < 6; orientation++) {
                            if (this.canPlaceDomino(row, col, piece, orientation)) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            
            checkGameEnd() {
                // Игра завершается, когда у обоих игроков не осталось костяшек
                // или когда никто не может сделать ход
                if (this.players[0].pieces.length === 0 && this.players[1].pieces.length === 0) {
                    this.gamePhase = 'gameover';
                    setTimeout(() => {
                        const winner = this.players[0].score > this.players[1].score ? 1 : 
                                     this.players[1].score > this.players[0].score ? 2 : 0;
                        if (winner === 0) {
                            alert('Ничья!');
                        } else {
                            alert(`Игрок ${winner} победил со счетом ${this.players[winner-1].score}!`);
                        }
                    }, 500);
                }
            }
            
            updateGamePhase() {
                const phaseElement = document.getElementById('gamePhase');
                if (this.gamePhase === 'gameover') {
                    phaseElement.textContent = 'Игра завершена';
                } else {
                    phaseElement.textContent = `Ход игрока ${this.currentPlayer + 1}`;
                }
                
                document.getElementById('player1').classList.toggle('active', this.currentPlayer === 0);
                document.getElementById('player2').classList.toggle('active', this.currentPlayer === 1);
            }
            
            updateScores() {
                const totalUsed = this.usedPieces.length;
                const totalPieces = this.dominoPieces.length;
                const scoreDisplay = document.getElementById('scoreDisplay');
                scoreDisplay.textContent = 
                    `Счёт: И1:${this.players[0].score} | И2:${this.players[1].score} | Ост:${totalPieces - totalUsed}`;
            }
            
            drawBoard() {
                const dpr = window.devicePixelRatio || 1;
                const canvasWidth = this.canvas.width / dpr;
                const canvasHeight = this.canvas.height / dpr;
                
                // Сбрасываем все трансформации и очищаем canvas
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.scale(dpr, dpr);
                this.ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                
                // Сохраняем контекст и применяем трансформации камеры
                // Сначала смещаем, затем масштабируем
                this.ctx.save();
                this.ctx.translate(this.camera.x, this.camera.y);
                this.ctx.scale(this.camera.scale, this.camera.scale);
                
                // Рисуем сетку (используем мировые координаты напрямую)
                if (this.showGrid) {
                    this.drawGrid();
                }
                
                // Рисуем размещенные костяшки
                this.drawPlacedDominos();
                
                // Подсвечиваем допустимые ходы
                if (this.selectedPiece && this.showHighlights) {
                    this.drawValidMoves();
                }
                
                // Рисуем превью размещения
                if (this.selectedPiece && this.hoveredHex) {
                    this.drawPlacementPreview();
                }
                
                // Восстанавливаем контекст
                this.ctx.restore();
            }
            
            drawGrid() {
                // Рисуем используя мировые координаты (трансформация уже применена через ctx.scale)
                for (let row = 0; row < this.boardSize; row++) {
                    for (let col = 0; col < this.boardSize; col++) {
                        const center = this.getHexCenter(row, col);
                        this.drawEmptyHex(center.x, center.y, center.hexSize);
                    }
                }
            }
            
            drawEmptyHex(x, y, hexSize) {
                this.ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 3 * i;
                    const hexX = x + hexSize * Math.cos(angle);
                    const hexY = y + hexSize * Math.sin(angle);
                    if (i === 0) this.ctx.moveTo(hexX, hexY);
                    else this.ctx.lineTo(hexX, hexY);
                }
                this.ctx.closePath();
                
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                this.ctx.fill();
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 1 / this.camera.scale; // Компенсируем масштаб для линии
                this.ctx.stroke();
            }
            
            drawPlacedDominos() {
                // Рисуем используя мировые координаты (трансформация уже применена через ctx.scale)
                for (let row = 0; row < this.boardSize; row++) {
                    for (let col = 0; col < this.boardSize; col++) {
                        const cell = this.board[row][col];
                        if (cell !== null) {
                            const center = this.getHexCenter(row, col);
                            this.drawDominoInHex(center.x, center.y, center.hexSize, cell);
                        }
                    }
                }
            }
            
            drawDominoInHex(x, y, hexSize, domino) {
                const orientation = domino.orientation;
                const values = domino.values;
                const player = domino.player;
                
                // Базовый цвет игрока
                const baseColor = player === 0 ? 
                    { r: 255, g: 107, b: 107 } : { r: 78, g: 205, b: 196 };
                
                // Вычисляем все вершины шестиугольника
                const vertices = [];
                for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 3 * i;
                    vertices.push({
                        x: x + hexSize * Math.cos(angle),
                        y: y + hexSize * Math.sin(angle)
                    });
                }
                
                // Определяем разделительную линию
                // Для ориентации 0: половина 0 смотрит в направлении 0 (вершина 0)
                // Половина 1 смотрит в направлении 3 (вершина 3)
                // Разделительная линия проходит через центр и перпендикулярна линии 0-3
                // Это означает, что она проходит через вершины 1 и 4
                
                // Первая половина включает вершины: orientation, orientation+1, orientation+2
                // Вторая половина включает вершины: orientation+3, orientation+4, orientation+5
                // Разделительная линия: от вершины (orientation-1) к вершине (orientation+2)
                
                const dividerStartIdx = (orientation - 1 + 6) % 6;
                const dividerEndIdx = (orientation + 2 + 6) % 6;
                
                // Рисуем первую половину (для значения values[0])
                // Первая половина: 3 вершины от orientation до orientation+2
                this.ctx.beginPath();
                this.ctx.moveTo(x, y); // Начинаем с центра
                // Добавляем вершины первой половины (по часовой стрелке)
                for (let i = 0; i < 3; i++) {
                    const idx = (orientation + i) % 6;
                    this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                }
                this.ctx.closePath();
                // Заливаем первую половину чуть более светлым оттенком
                this.ctx.fillStyle = `rgba(${baseColor.r + 30}, ${baseColor.g + 30}, ${baseColor.b + 30}, 0.7)`;
                this.ctx.fill();
                
                // Рисуем вторую половину (для значения values[1])
                // Вторая половина: 3 вершины от orientation+3 до orientation+5
                this.ctx.beginPath();
                this.ctx.moveTo(x, y); // Начинаем с центра
                // Добавляем вершины второй половины (по часовой стрелке)
                for (let i = 0; i < 3; i++) {
                    const idx = (orientation + 3 + i) % 6;
                    this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                }
                this.ctx.closePath();
                // Заливаем вторую половину чуть более темным оттенком
                this.ctx.fillStyle = `rgba(${baseColor.r - 30}, ${baseColor.g - 30}, ${baseColor.b - 30}, 0.7)`;
                this.ctx.fill();
                
                // Рисуем контур всего шестиугольника
                this.ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    if (i === 0) this.ctx.moveTo(vertices[i].x, vertices[i].y);
                    else this.ctx.lineTo(vertices[i].x, vertices[i].y);
                }
                this.ctx.closePath();
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                this.ctx.lineWidth = 2 / this.camera.scale;
                this.ctx.stroke();
                
                // Рисуем разделительную полосу от края до края через центр
                const dividerStart = vertices[dividerStartIdx];
                const dividerEnd = vertices[dividerEndIdx];
                
                this.ctx.beginPath();
                this.ctx.moveTo(dividerStart.x, dividerStart.y);
                this.ctx.lineTo(dividerEnd.x, dividerEnd.y);
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 1.0)';
                this.ctx.lineWidth = 4 / this.camera.scale; // Толстая белая линия
                this.ctx.stroke();
                
                // Рисуем числа
                if (this.showNumbers) {
                    // Вычисляем углы для позиционирования цифр
                    // Первое число в направлении ориентации (вершина orientation)
                    const angle1 = Math.PI / 3 * orientation;
                    // Второе число в противоположном направлении (вершина orientation+3)
                    const angle2 = Math.PI / 3 * ((orientation + 3) % 6);
                    
                    this.ctx.fillStyle = 'white';
                    const fontSize = Math.max(10, hexSize * 0.4);
                    this.ctx.font = `bold ${fontSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    // Первое число (в направлении ориентации)
                    const text1X = x + hexSize * 0.4 * Math.cos(angle1);
                    const text1Y = y + hexSize * 0.4 * Math.sin(angle1);
                    this.ctx.fillText(values[0].toString(), text1X, text1Y);
                    
                    // Второе число (в противоположном направлении)
                    const text2X = x + hexSize * 0.4 * Math.cos(angle2);
                    const text2Y = y + hexSize * 0.4 * Math.sin(angle2);
                    this.ctx.fillText(values[1].toString(), text2X, text2Y);
                }
            }
            
            drawValidMoves() {
                if (!this.selectedPiece) return;
                
                // Рисуем используя мировые координаты (трансформация уже применена через ctx.scale)
                this.ctx.save();
                this.ctx.globalAlpha = 0.4;
                
                const values = this.selectedPiece.values;
                
                for (const move of this.validMoves) {
                    // Используем правильную ориентацию для данного хода (если указана), иначе текущую
                    const orientation = move.orientation !== undefined ? move.orientation : this.pieceOrientation;
                    const center = this.getHexCenter(move.row, move.col);
                    const hexSize = center.hexSize;
                    const x = center.x;
                    const y = center.y;
                    
                    // Вычисляем все вершины шестиугольника
                    const vertices = [];
                    for (let i = 0; i < 6; i++) {
                        const angle = Math.PI / 3 * i;
                        vertices.push({
                            x: x + hexSize * Math.cos(angle),
                            y: y + hexSize * Math.sin(angle)
                        });
                    }
                    
                    // Определяем разделительную линию
                    const dividerStartIdx = (orientation - 1 + 6) % 6;
                    const dividerEndIdx = (orientation + 2 + 6) % 6;
                    
                    // Рисуем первую половину (светлее)
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                    for (let i = 0; i < 3; i++) {
                        const idx = (orientation + i) % 6;
                        this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                    }
                    this.ctx.closePath();
                    this.ctx.fillStyle = 'rgba(0, 255, 0, 0.3)'; // Светло-зеленый
                    this.ctx.fill();
                    
                    // Рисуем вторую половину (темнее)
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                    for (let i = 0; i < 3; i++) {
                        const idx = (orientation + 3 + i) % 6;
                        this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                    }
                    this.ctx.closePath();
                    this.ctx.fillStyle = 'rgba(0, 200, 0, 0.3)'; // Темно-зеленый
                    this.ctx.fill();
                    
                    // Рисуем контур шестиугольника
                    this.ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        if (i === 0) this.ctx.moveTo(vertices[i].x, vertices[i].y);
                        else this.ctx.lineTo(vertices[i].x, vertices[i].y);
                    }
                    this.ctx.closePath();
                    this.ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
                    this.ctx.lineWidth = 2 / this.camera.scale;
                    this.ctx.stroke();
                    
                    // Рисуем разделительную полосу
                    const dividerStart = vertices[dividerStartIdx];
                    const dividerEnd = vertices[dividerEndIdx];
                    this.ctx.beginPath();
                    this.ctx.moveTo(dividerStart.x, dividerStart.y);
                    this.ctx.lineTo(dividerEnd.x, dividerEnd.y);
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.lineWidth = 3 / this.camera.scale;
                    this.ctx.stroke();
                    
                    // Рисуем числа
                    if (this.showNumbers) {
                        // Вычисляем углы для позиционирования цифр
                        const angle1 = Math.PI / 3 * orientation;
                        const angle2 = Math.PI / 3 * ((orientation + 3) % 6);
                        
                        this.ctx.fillStyle = 'rgba(0, 255, 0, 0.9)';
                        const fontSize = Math.max(10, hexSize * 0.4);
                        this.ctx.font = `bold ${fontSize}px Arial`;
                        this.ctx.textAlign = 'center';
                        this.ctx.textBaseline = 'middle';
                        
                        // Первое число (в направлении ориентации)
                        const text1X = x + hexSize * 0.4 * Math.cos(angle1);
                        const text1Y = y + hexSize * 0.4 * Math.sin(angle1);
                        this.ctx.fillText(values[0].toString(), text1X, text1Y);
                        
                        // Второе число (в противоположном направлении)
                        const text2X = x + hexSize * 0.4 * Math.cos(angle2);
                        const text2Y = y + hexSize * 0.4 * Math.sin(angle2);
                        this.ctx.fillText(values[1].toString(), text2X, text2Y);
                    }
                }
                
                this.ctx.restore();
            }
            
            drawPlacementPreview() {
                const isValid = this.validMoves.some(move => 
                    move.row === this.hoveredHex.row && move.col === this.hoveredHex.col
                );
                
                if (!isValid) return;
                
                // Рисуем используя мировые координаты (трансформация уже применена через ctx.scale)
                const center = this.getHexCenter(this.hoveredHex.row, this.hoveredHex.col);
                const orientation = this.pieceOrientation;
                
                this.ctx.save();
                this.ctx.globalAlpha = 0.6;
                
                // Вычисляем все вершины шестиугольника для превью
                const vertices = [];
                for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 3 * i;
                    vertices.push({
                        x: center.x + center.hexSize * Math.cos(angle),
                        y: center.y + center.hexSize * Math.sin(angle)
                    });
                }
                
                // Рисуем первую половину превью (более светлый оттенок золотого)
                this.ctx.beginPath();
                this.ctx.moveTo(center.x, center.y);
                for (let i = 0; i < 3; i++) {
                    const idx = (orientation + i) % 6;
                    this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                }
                this.ctx.closePath();
                this.ctx.fillStyle = 'rgba(255, 235, 59, 0.4)'; // Светлый золотой
                this.ctx.fill();
                
                // Рисуем вторую половину превью (более темный оттенок золотого)
                this.ctx.beginPath();
                this.ctx.moveTo(center.x, center.y);
                for (let i = 0; i < 3; i++) {
                    const idx = (orientation + 3 + i) % 6;
                    this.ctx.lineTo(vertices[idx].x, vertices[idx].y);
                }
                this.ctx.closePath();
                this.ctx.fillStyle = 'rgba(255, 193, 7, 0.4)'; // Темный золотой
                this.ctx.fill();
                
                // Рисуем контур превью
                this.ctx.strokeStyle = '#FFD700';
                this.ctx.lineWidth = 3 / this.camera.scale;
                this.ctx.setLineDash([5 / this.camera.scale, 5 / this.camera.scale]);
                this.ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    if (i === 0) this.ctx.moveTo(vertices[i].x, vertices[i].y);
                    else this.ctx.lineTo(vertices[i].x, vertices[i].y);
                }
                this.ctx.closePath();
                this.ctx.stroke();
                this.ctx.setLineDash([]);
                
                // Рисуем разделительную полосу от края до края
                const dividerStartIdx = (orientation - 1 + 6) % 6;
                const dividerEndIdx = (orientation + 2 + 6) % 6;
                const dividerStart = vertices[dividerStartIdx];
                const dividerEnd = vertices[dividerEndIdx];
                
                this.ctx.beginPath();
                this.ctx.moveTo(dividerStart.x, dividerStart.y);
                this.ctx.lineTo(dividerEnd.x, dividerEnd.y);
                this.ctx.strokeStyle = '#FFD700';
                this.ctx.lineWidth = 4 / this.camera.scale;
                this.ctx.stroke();
                
                // Рисуем числа
                if (this.showNumbers) {
                    this.ctx.fillStyle = '#FFD700';
                    const fontSize = Math.max(10, center.hexSize * 0.4);
                    this.ctx.font = `bold ${fontSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    // Углы для позиционирования цифр относительно ориентации превью
                    const angle1 = Math.PI / 3 * orientation;
                    const angle2 = Math.PI / 3 * ((orientation + 3) % 6);
                    
                    const text1X = center.x + center.hexSize * 0.4 * Math.cos(angle1);
                    const text1Y = center.y + center.hexSize * 0.4 * Math.sin(angle1);
                    this.ctx.fillText(this.selectedPiece.values[0].toString(), text1X, text1Y);
                    
                    const text2X = center.x + center.hexSize * 0.4 * Math.cos(angle2);
                    const text2Y = center.y + center.hexSize * 0.4 * Math.sin(angle2);
                    this.ctx.fillText(this.selectedPiece.values[1].toString(), text2X, text2Y);
                }
                
                this.ctx.restore();
            }
        }

        // Инициализация игры
        document.addEventListener('DOMContentLoaded', () => {
            new HexagonalDomino();
        });

        // Предотвращение масштабирования на iOS
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
